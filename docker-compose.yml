# Mediul de dezvoltare: baza de date PostgreSQL.
# Pornire: docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movemeal}
      POSTGRES_USER: ${POSTGRES_USER:-movemeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Seteaza POSTGRES_PASSWORD in fisierul .env}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-movemeal}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
